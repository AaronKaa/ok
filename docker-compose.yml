services:
  ok:
    build:
      context: .
      dockerfile: Dockerfile
    image: ok:latest
    container_name: ok
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
    # Note: Container uses scratch base image without shell utilities.
    # Use external health probes (load balancer, orchestrator) against /health endpoint.
    # For Docker-native healthcheck, switch to distroless or alpine base image.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M
    security_opt:
      - no-new-privileges:true
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
